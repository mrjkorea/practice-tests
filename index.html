<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="MRJ 연습 테스트 모음 — 학교별 실전 모의고사 및 연습 시험"
    />
    <title>MRJ Practice Tests · 연습 테스트</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__brand">
        <div class="site-header__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
            <path d="M8 7h8M8 11h6" />
          </svg>
        </div>
      </div>
      <h1>MRJ Practice Tests</h1>
      <p class="site-header__subtitle">연습 테스트</p>
      <p class="site-header__tagline">
        학교별 실전 모의고사와 연습 시험을 한곳에서 선택하세요. 로그인 없이 바로 시작할 수 있습니다.
      </p>
    </header>

    <main>
      <p class="section-label">시험 목록</p>
      <p id="list-status" class="loading" aria-live="polite">목록 불러오는 중…</p>
      <ul id="test-list" class="test-list" aria-label="연습 테스트 목록"></ul>
    </main>

    <footer class="site-footer">
      <p>새 테스트 추가: 저장소의 <code>tests.json</code>에 항목을 추가하세요.</p>
      <p><a href="https://github.com/mrjkorea/practice-tests">GitHub · practice-tests</a></p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
